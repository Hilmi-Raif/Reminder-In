name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  test-and-automerge:
    name: Run Unit Tests & Auto-Merge Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Dependabot Auto-Merge
        if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    name: Build & Publish Docker Image
    needs: test-and-automerge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Automated Version Tag
        id: versioning
        run: |
          if [ -f VERSION ]; then
            TAG_NAME=$(cat VERSION | tr -d '\r\n')
          else
            TAG_NAME="v1.0.1"
          fi
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "sha_version=${TAG_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.versioning.outputs.version }}
            type=raw,value=${{ steps.versioning.outputs.sha_version }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.versioning.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
